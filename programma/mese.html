   const item=document.createElement('details');item.className='quiz-item';item.open=false;const itemSummary=document.createElement('summary');itemSummary.textContent=(i+1)+'. '+q[0];item.append(itemSummary);const field=document.createElement('fieldset');item.append(field);
   if(q[4]&&imageMatchesQuestion(q)){const img=document.createElement('img');img.src=q[4];img.alt='Opera da osservare';img.loading='lazy';img.onclick=()=>window.open(img.src,'_blank','noopener');img.onerror=()=>{img.alt='Immagine non disponibile: impossibile rispondere alla domanda visiva';};field.append(img)}
   q[1].forEach((answer,j)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='quiz-'+month+'-'+key+'-'+i;label.append(input,document.createTextNode(' '+answer));field.append(label);input.addEventListener('change',()=>{
    field.querySelectorAll('input').forEach(x=>x.disabled=true);
    const ok=j===q[2];answered++;if(ok)correct++;
    const p=document.createElement('p');p.textContent=(ok?'✓ Corretta. ':'✗ Risposta corretta: '+q[1][q[2]]+'. ')+q[3];field.append(p);
    score.textContent='Risposte corrette: '+correct+' su '+answered+' — domande: '+questions.length;summary.textContent=title+' — '+answered+'/'+questions.length+' completate';itemSummary.textContent=(i+1)+'. '+q[0]+' '+(ok?'✓':'✗');
    if(answered===questions.length){const storageKey='arthistory-quiz-'+month+'-'+key;const previous=JSON.parse(localStorage.getItem(storageKey)||'{}');localStorage.setItem(storageKey,JSON.stringify({last:correct,best:Math.max(previous.best||0,correct),total:questions.length,date:new Date().toISOString()}));}
   })});
   item.addEventListener('toggle',()=>{if(item.open)inner.querySelectorAll('details.quiz-item').forEach(other=>{if(other!==item)other.open=false;});});inner.append(item);
  });
  inner.append(score);
  const retry=document.createElement('button');retry.type='button';retry.className='btn secondary';retry.textContent='Ricomincia il quiz';retry.onclick=()=>section.replaceWith(build(title,questions,key));inner.append(retry);
  return section;
 }
 const chapters=[...content.querySelectorAll('details.chapter')];
 const weekly=all.weeks||[];
 for(let i=0;i<4;i++){
  const ch=chapters.find(x=>new RegExp('^Settimana\\s+'+(i+1)+'\\b','i').test(x.querySelector('summary')?.textContent.trim()||''));
  if(ch&&weekly[i]?.length)ch.querySelector('.chapter-body').append(build('Verifica della settimana '+(i+1),weekly[i],'w'+(i+1)));
 }
 const final=chapters.find(x=>/^Verifica di fine mese/i.test(x.querySelector('summary')?.textContent.trim()||''));
 if(final){const body=final.querySelector('.chapter-body');body.insertBefore(build('Quiz finale del mese',all.final||all,'final'),body.firstChild);}
}
function toolsHtml(slot){return `<h3>Appunti personali</h3><textarea class="notes" data-note="${slot}" placeholder="Note rapide, concetti, dubbi, collegamenti…"></textarea><div class="save-state" data-note-state="${slot}"></div><h3>Quaderno di lavoro</h3><textarea class="work" data-work="${slot}" placeholder="Svolgi qui esercizi, analisi e testi lunghi. Il contenuto viene sincronizzato con Firebase quando sei connesso."></textarea><div class="row"><label>Stato: <select class="status" data-status="${slot}"><option value="todo">Da fare</option><option value="doing">In lavorazione</option><option value="done">Completata — da revisionare</option><option value="reviewed">Revisionata</option></select></label></div><div class="review-hint" data-review-hint="${slot}"></div><h3>Link elaborato / foto / video / file</h3><input class="worklink" data-link="${slot}" placeholder="https://…"><h3>Feedback / revisione ricevuta</h3><textarea class="feedback" data-feedback="${slot}" placeholder="Incolla qui il feedback ricevuto e le correzioni da conservare."></textarea><div class="tool-actions"><button class="btn primary copy-review" data-copy="${slot}">Copia per revisione ChatGPT</button></div>`}
async function render(){try{const r=await fetch(mdFile+'?v='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);let src=preprocess(await r.text());content.innerHTML=marked.parse(src,{gfm:true});compactChapters();content.querySelectorAll('a[href]').forEach(a=>{try{const u=new URL(a.href,location.href);if(u.origin!==location.origin){a.target='_blank';a.rel='noopener noreferrer'}}catch{}});document.title=(content.querySelector('h1')?.textContent||'ArtHistory')+' — ArtHistory';content.querySelectorAll('.study-tools[data-slot]').forEach(el=>el.innerHTML=toolsHtml(el.dataset.slot));content.querySelectorAll('span[data-task-id]').forEach(span=>{const li=span.closest('li');const cb=li?.querySelector('input[type=checkbox]');if(cb){cb.disabled=false;cb.dataset.id=span.dataset.taskId;cb.dataset.required=span.dataset.required||'true';const date=document.createElement('span');date.className='completion-date';date.dataset.dateFor=span.dataset.taskId;li.appendChild(date)}});boxes=[...content.querySelectorAll('input[type=checkbox][data-id]')];notes=[...content.querySelectorAll('[data-note]')];works=[...content.querySelectorAll('[data-work]')];statuses=[...content.querySelectorAll('[data-status]')];links=[...content.querySelectorAll('[data-link]')];feedbacks=[...content.querySelectorAll('[data-feedback]')];wire();apply(localData());try{await insertQuiz()}catch(quizError){console.error(quizError);const warning=document.createElement('p');warning.textContent='Errore nel caricamento dei quiz: '+quizError.message;content.prepend(warning)}paint()}catch(e){content.innerHTML='<div class="error"><strong>Errore nel caricamento del mese.</strong><br>'+e.message+'</div>'}}
function parseLocal(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function mergeData(a={},b={}){const out={...a,...b};for(const key of ['progress','completionDates','notes','work','statuses','links','feedback'])out[key]={...(a[key]||{}),...(b[key]||{})};return out}
function migrateLegacy(d={}){if((d.schemaVersion||0)>=schemaVersion)return d;const oldVersion=d.schemaVersion||0,out=mergeData({},d),p={...(d.progress||{})};if(month==='01'&&oldVersion<5){const oldParthenon=!!p['w1-video1'];const oldDory=!!p['w1-video2'];delete p['w1-video1'];delete p['w1-video2'];if(oldDory)p['w1-video2']=true;if(oldParthenon)p['w1-video3']=true}out.progress=p;out.completionDates={...(d.completionDates||{})};out.schemaVersion=schemaVersion;return out}
function localData(){const current=parseLocal(localKey);if(current)return current;let merged={};const legacyKeys=month==='01'?['arthistory-mese-01-v5','arthistory-mese-01-v4','arthistory-mese01-v2','arthistory-mese01-v1']:['arthistory-'+monthId+'-v5'];for(const k of legacyKeys){const d=parseLocal(k);if(d)merged=mergeData(merged,migrateLegacy(d))}merged.schemaVersion=schemaVersion;if(Object.keys(merged).length>1)localStorage.setItem(localKey,JSON.stringify(merged));return merged}
function collect(){const progress={},n={},w={},s={},l={},f={};boxes.forEach(b=>progress[b.dataset.id]=b.checked);notes.forEach(x=>n[x.dataset.note]=x.value);works.forEach(x=>w[x.dataset.work]=x.value);statuses.forEach(x=>s[x.dataset.status]=x.value);links.forEach(x=>l[x.dataset.link]=x.value);feedbacks.forEach(x=>f[x.dataset.feedback]=x.value);return {schemaVersion,progress,completionDates,notes:n,work:w,statuses:s,links:l,feedback:f}}
function formatDate(iso){if(!iso)return'';const d=new Date(iso);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})}
function paint(){boxes.forEach(b=>{b.closest('li')?.classList.toggle('task-done',b.checked);const el=content.querySelector(`[data-date-for="${b.dataset.id}"]`);if(el)el.textContent=b.checked&&completionDates[b.dataset.id]?'✓ '+formatDate(completionDates[b.dataset.id]):''});statuses.forEach(s=>{const hint=content.querySelector(`[data-review-hint="${s.dataset.status}"]`);if(!hint)return;if(s.value==='done')hint.textContent='Il lavoro è completato ma non ancora chiuso: copialo per la revisione ChatGPT e, dopo aver ricevuto il feedback, passa a “Revisionata”.';else if(s.value==='reviewed')hint.textContent='Revisione completata.';else hint.textContent=''});const required=boxes.filter(b=>b.dataset.required!=='false');pct.textContent=required.length?Math.round(required.filter(b=>b.checked).length/required.length*100)+'%':'0%'}
function apply(d={}){const p=d.progress||{},n=d.notes||{},w=d.work||{},s=d.statuses||{},l=d.links||{},f=d.feedback||{};completionDates={...(d.completionDates||{})};boxes.forEach(b=>b.checked=!!p[b.dataset.id]);notes.forEach(x=>x.value=n[x.dataset.note]||'');works.forEach(x=>x.value=w[x.dataset.work]||'');statuses.forEach(x=>x.value=s[x.dataset.status]||'todo');links.forEach(x=>x.value=l[x.dataset.link]||'');feedbacks.forEach(x=>x.value=f[x.dataset.feedback]||'');paint()}
function saveLocal(){localStorage.setItem(localKey,JSON.stringify(collect()));paint()}
function userDoc(){return doc(db,'users',currentUser.uid,'months',monthId)}
async function saveCloud(){if(!currentUser)return;syncState.textContent='Salvataggio…';try{await setDoc(userDoc(),{...collect(),updatedAt:serverTimestamp()},{merge:true});syncState.textContent='Sincronizzato';setTimeout(()=>{if(syncState.textContent==='Sincronizzato')syncState.textContent=''},1200)}catch(e){console.error(e);syncState.textContent='Errore sincronizzazione'}}
function schedule(){saveLocal();if(currentUser){clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,500)}}
function wire(){boxes.forEach(x=>x.addEventListener('change',()=>{if(x.checked&&!completionDates[x.dataset.id])completionDates[x.dataset.id]=new Date().toISOString();if(!x.checked)delete completionDates[x.dataset.id];schedule()}));[...notes,...works,...links,...feedbacks].forEach(x=>x.addEventListener('input',schedule));statuses.forEach(x=>x.addEventListener('change',()=>{paint();schedule()}));content.querySelectorAll('.copy-review').forEach(btn=>btn.addEventListener('click',async()=>{const slot=btn.dataset.copy;const work=works.find(x=>x.dataset.work===slot)?.value||'';const link=links.find(x=>x.dataset.link===slot)?.value||'';const status=statuses.find(x=>x.dataset.status===slot);if(!work.trim()&&!link.trim()){alert('Prima inserisci nel Quaderno di lavoro il testo da revisionare o un link all’elaborato.');return}if(status&&status.value!=='reviewed')status.value='done';const text=`Sto seguendo il percorso ArtHistory. Sezione: ${slot}.\n\nELABORATO:\n${work}\n\nLINK EVENTUALE:\n${link}\n\nRevisiona il lavoro rispetto alla consegna del capitolo. Dimmi: 1) cosa funziona; 2) errori o debolezze; 3) cosa manca; 4) come migliorarlo senza riscriverlo al posto mio; 5) una valutazione sintetica del livello raggiunto.`;await navigator.clipboard.writeText(text);schedule();btn.textContent='Copiato — incolla in ChatGPT';setTimeout(()=>btn.textContent='Copia per revisione ChatGPT',1800)}))}
async function handleAuthUser(user){currentUser=user;if(!user){userStatus.textContent='Non connesso: dati solo su questo dispositivo.';loginBtn.classList.remove('hidden');logoutBtn.classList.add('hidden');syncState.textContent='';apply(localData());return}userStatus.textContent='Connesso come '+(user.email||user.displayName||'utente Google');loginBtn.classList.add('hidden');logoutBtn.classList.remove('hidden');syncState.textContent='Caricamento…';try{const local=localData(),snap=await getDoc(userDoc());if(snap.exists()){const cloud=migrateLegacy(snap.data());const merged=mergeData(local,cloud);Object.keys(local.progress||{}).forEach(k=>{if(local.progress[k]===true)merged.progress[k]=true});Object.keys(local.completionDates||{}).forEach(k=>{if(!merged.completionDates[k])merged.completionDates[k]=local.completionDates[k]});merged.schemaVersion=schemaVersion;apply(merged);saveLocal();await saveCloud()}else{apply(local);await saveCloud()}syncState.textContent='Sincronizzato';setTimeout(()=>syncState.textContent='',1200)}catch(e){console.error(e);syncState.textContent='Errore caricamento'}}
await render();
onAuthStateChanged(auth,user=>{if(boxes.length)handleAuthUser(user)});
loginBtn.addEventListener('click',async()=>{try{syncState.textContent='Accesso Google…';const result=await signInWithPopup(auth,provider);await handleAuthUser(result.user)}catch(e){console.error('Google popup auth error',e);syncState.textContent='Errore accesso: '+(e.code||e.message);if(e.code==='auth/popup-blocked')alert('Chrome ha bloccato il popup. Consenti i popup per arte.3colors.it e riprova.');else if(e.code!=='auth/popup-closed-by-user')alert('Accesso Google non riuscito: '+e.message)}});
logoutBtn.addEventListener('click',()=>signOut(auth));
if(auth.currentUser)await handleAuthUser(auth.currentUser);
</script>
